# Synthetic: the claim holds vf-old, which only the superseded generation 1 publishes.
apiVersion: v1
kind: List
items:
- apiVersion: resource.k8s.io/v1
  kind: ResourceSlice
  metadata:
    name: counters-gen1
  spec:
    driver: gpu.example.com
    nodeName: node-a.example.com
    pool: {name: node-a.example.com, generation: 1, resourceSliceCount: 2}
    sharedCounters:
      - name: pf-0
        counters:
          vf-slots: {value: '2'}
- apiVersion: resource.k8s.io/v1
  kind: ResourceSlice
  metadata:
    name: devices-gen1
  spec:
    driver: gpu.example.com
    nodeName: node-a.example.com
    pool: {name: node-a.example.com, generation: 1, resourceSliceCount: 2}
    devices:
    - name: vf-old
      consumesCounters:
      - counterSet: pf-0
        counters:
          vf-slots: {value: '1'}
- apiVersion: resource.k8s.io/v1
  kind: ResourceSlice
  metadata:
    name: counters-gen2
  spec:
    driver: gpu.example.com
    nodeName: node-a.example.com
    pool: {name: node-a.example.com, generation: 2, resourceSliceCount: 2}
    sharedCounters:
      - name: pf-0
        counters:
          vf-slots: {value: '2'}
- apiVersion: resource.k8s.io/v1
  kind: ResourceSlice
  metadata:
    name: devices-gen2
  spec:
    driver: gpu.example.com
    nodeName: node-a.example.com
    pool: {name: node-a.example.com, generation: 2, resourceSliceCount: 2}
    devices:
    - name: vf-new
      consumesCounters:
      - counterSet: pf-0
        counters:
          vf-slots: {value: '1'}
- apiVersion: resource.k8s.io/v1
  kind: ResourceClaim
  metadata: {name: vfs, namespace: demo}
  spec:
    devices:
      requests:
      - name: vf
        exactly: {deviceClassName: gpu.example.com, allocationMode: ExactCount, count: 1}
  status:
    allocation:
      devices:
        results:
        - {request: vf, driver: gpu.example.com, pool: node-a.example.com, device: vf-old}
