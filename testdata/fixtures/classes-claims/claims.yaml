apiVersion: v1
kind: List
items:
- apiVersion: resource.k8s.io/v1
  kind: ResourceClaim
  metadata: {name: shared-gpu, namespace: demo}
  spec:
    devices:
      requests:
      - name: gpu
        exactly:
          deviceClassName: gpu.example.com
          allocationMode: ExactCount
          count: 1
          selectors:
          - cel: {expression: 'device.attributes["gpu.example.com"].claimleakmarker'}
      config:
      - opaque:
          driver: gpu.example.com
          parameters: {claimKnob: opaque-parameter-marker}
  status:
    allocation:
      devices:
        results:
        - {request: gpu, driver: gpu.example.com, pool: node-a.example.com, device: gpu-0}
    reservedFor:
    - {resource: pods, name: virt-launcher-vm1-abcde, uid: 00000000-0000-4000-8000-000000000001}
- apiVersion: resource.k8s.io/v1
  kind: ResourceClaim
  metadata: {name: web-0-gpu-xyz12, namespace: demo}
  spec:
    devices:
      requests:
      - name: gpu
        exactly: {deviceClassName: gpu.example.com, allocationMode: ExactCount, count: 1}
  status:
    allocation:
      devices:
        results:
        - {request: gpu, driver: gpu.example.com, pool: node-a.example.com, device: gpu-1}
- apiVersion: resource.k8s.io/v1
  kind: ResourceClaim
  metadata: {name: broken, namespace: demo}
  spec:
    devices:
      requests:
      - name: gpu
        exactly: {deviceClassName: gpu.example.com, allocationMode: ExactCount, count: 1}
  status:
    allocation:
      devices:
        results:
        - {request: gpu, driver: gpu.example.com, pool: node-a.example.com, device: gpu-9}
- apiVersion: resource.k8s.io/v1
  kind: ResourceClaim
  metadata: {name: pending, namespace: demo}
  spec:
    devices:
      requests:
      - name: nic
        exactly: {deviceClassName: nic.example.com, allocationMode: All}
