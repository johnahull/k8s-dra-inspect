apiVersion: v1
kind: List
items:
- apiVersion: resource.k8s.io/v1
  kind: DeviceClass
  metadata:
    name: gpu.example.com
    labels:
      tier: gold
      vendor: example
  spec:
    selectors:
    - cel: {expression: 'device.driver == "gpu.example.com" && device.attributes["gpu.example.com"].leakmarker'}
    - cel: {expression: 'device.capacity["gpu.example.com"].memory.isGreaterThan(quantity("1Gi"))'}
    config:
    - opaque:
        driver: gpu.example.com
        parameters: {kind: GpuConfig, secretKnob: opaque-parameter-marker}
- apiVersion: resource.k8s.io/v1
  kind: DeviceClass
  metadata:
    name: plain.example.com
  spec:
    selectors:
    - cel: {expression: 'device.driver == "plain.example.com"'}
- apiVersion: resource.k8s.io/v1
  kind: DeviceClass
  metadata:
    name: nic.example.com
    labels:
      tier: silver
      vendor: example
  spec:
    config:
    - opaque:
        driver: nic.example.com
        parameters: {mode: opaque-parameter-marker}
