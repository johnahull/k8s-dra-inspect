{{- if eq .Values.rbac.profile "cluster" }}
# Keep in sync with docs/rbac.md; hack/check-chart.sh enforces it.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "dra-inspect.fullname" . }}
  labels:
    {{- include "dra-inspect.labels" . | nindent 4 }}
rules:
- apiGroups: ["resource.k8s.io"]
  resources: ["resourceslices", "deviceclasses", "resourceclaims"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["pods", "nodes"]
  verbs: ["get", "list"]
{{- include "dra-inspect.kubevirtRule" . }}
{{- end }}
