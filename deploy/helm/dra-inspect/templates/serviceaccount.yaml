{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "dra-inspect.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dra-inspect.labels" . | nindent 4 }}
# Only the Job pod opts in to the API token.
automountServiceAccountToken: false
{{- end }}
