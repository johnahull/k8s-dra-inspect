{{- if eq .Values.rbac.profile "cluster" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "dra-inspect.fullname" . }}
  labels:
    {{- include "dra-inspect.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "dra-inspect.fullname" . }}
subjects:
- kind: ServiceAccount
  name: {{ include "dra-inspect.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- end }}
