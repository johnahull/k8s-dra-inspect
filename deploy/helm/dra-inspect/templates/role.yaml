{{- if eq .Values.rbac.profile "namespace" }}
{{- range $ns := (include "dra-inspect.namespaces" . | fromJsonArray) }}
---
# Keep in sync with docs/rbac.md; hack/check-chart.sh enforces it.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "dra-inspect.fullname" $ }}
  namespace: {{ $ns }}
  labels:
    {{- include "dra-inspect.labels" $ | nindent 4 }}
rules:
- apiGroups: ["resource.k8s.io"]
  resources: ["resourceclaims"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
{{- include "dra-inspect.kubevirtRule" $ }}
{{- end }}
{{- end }}
