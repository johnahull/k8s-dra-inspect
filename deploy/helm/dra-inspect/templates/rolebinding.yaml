{{- if eq .Values.rbac.profile "namespace" }}
{{- range $ns := (include "dra-inspect.namespaces" . | fromJsonArray) }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "dra-inspect.fullname" $ }}
  namespace: {{ $ns }}
  labels:
    {{- include "dra-inspect.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "dra-inspect.fullname" $ }}
subjects:
- kind: ServiceAccount
  name: {{ include "dra-inspect.serviceAccountName" $ }}
  namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
