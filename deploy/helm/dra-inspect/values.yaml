image:
  repository: ghcr.io/johnahull/k8s-dra-inspect
  # Empty means the chart appVersion.
  tag: ""
  # Optional, e.g. sha256:...; when set it is appended as repository:tag@digest.
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  create: true
  # Empty means the release fullname.
  name: ""

rbac:
  # cluster: ClusterRole + ClusterRoleBinding.
  # namespace: Role + RoleBinding in each listed namespace; ResourceSlices,
  # DeviceClasses and nodes are then reported as unavailable (see docs/rbac.md).
  profile: cluster
  # Namespace profile only. Empty means the release namespace.
  namespaces: []
  # Also grant get/list on kubevirt.io virtualmachineinstances.
  kubevirt: false

job:
  # The chart installs RBAC and the ServiceAccount only, unless this is true.
  enabled: false
  args: ["report", "cluster", "-o", "json", "--timeout", "60s"]
  ttlSecondsAfterFinished: 3600
  activeDeadlineSeconds: 300
  # Used as both runAsUser and runAsGroup; the image is built for 65532.
  runAsUser: 65532
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  podAnnotations: {}
  podLabels: {}
